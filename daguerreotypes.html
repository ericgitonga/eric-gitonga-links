<title>Daguerreotypes — Eric Gitonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="description" content="Photographs — landscapes, portraits, and documentary moments.">

<style>
  :root{
    --ground:#f3efe3;
    --ground-raised:#ece4cf;
    --ink:#241f16;
    --ink-muted:#7a7160;
    --accent:#3f6b53;
    --accent-dim:#8ba38f;
    --line:#d9cfb8;
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --label:'Archivo Narrow', 'Arial Narrow', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--label);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:1.3rem 1.8rem;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:.4rem;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--ground);
  }
  .breadcrumb{
    display:flex;
    align-items:baseline;
    gap:.5rem;
    font-family:var(--mono);
    font-size:.78rem;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .breadcrumb a{color:var(--ink);transition:color .15s ease;}
  .breadcrumb a:hover, .breadcrumb a:focus-visible{color:var(--accent);}
  .crumb-sep{color:var(--ink-muted); font-weight:400;}
  .breadcrumb [aria-current="page"]{color:var(--ink);}

  .page{
    max-width:680px;
    margin:0 auto;
    padding:clamp(2.5rem,6vw,4rem) clamp(1.25rem,4vw,1.5rem) 4rem;
  }

  .plate-no{
    display:block;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.14em;
    color:var(--ink-muted);
    margin-bottom:.5rem;
  }

  h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.4rem,7vw,3.2rem);
    line-height:1.05;
    margin:0 0 .7rem;
    text-wrap:balance;
  }

  .intro{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--ink-muted);
    max-width:36em;
    margin:0;
    line-height:1.5;
  }

  section.group{margin-top:clamp(2.25rem,5vw,3rem);}
  .group-label{
    display:flex;
    align-items:baseline;
    gap:.75rem;
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 .9rem;
  }
  .group-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.9rem 1.8rem;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.08em;
    color:var(--ink-muted);
  }

  .album-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:1rem;
  }
  .album-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:.4rem;
    padding:0;
    border:none;
    background:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
    text-align:left;
  }
  .album-thumb{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
  }
  .album-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
  }
  .album-card:hover .album-thumb img, .album-card:focus-visible .album-thumb img{
    transform:scale(1.04);
  }
  .album-title{
    font-family:var(--serif);
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink);
  }
  .album-count{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.06em;
    color:var(--ink-muted);
  }
  .gallery-updated{
    margin-top:1.5rem;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.04em;
    color:var(--ink-muted);
  }
  .gallery-empty{
    font-family:var(--serif);
    color:var(--ink-muted);
  }

  dialog#gallery-modal{
    border:none;
    padding:0;
    max-width:min(92vw,900px);
    width:100%;
    background:var(--ground);
    color:var(--ink);
  }
  dialog#gallery-modal::backdrop{
    background:rgba(20,17,10,.72);
  }
  dialog#gallery-modal .modal-close{
    position:absolute;
    top:.6rem;
    right:.8rem;
    background:none;
    border:none;
    font-size:1.6rem;
    line-height:1;
    cursor:pointer;
    color:var(--ink-muted);
    z-index:2;
    padding:0;
  }
  dialog#gallery-modal .modal-close:hover, dialog#gallery-modal .modal-close:focus-visible{
    color:var(--accent);
  }
  .gallery-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(36,31,22,.55);
    color:#f3efe3;
    border:none;
    width:2.6rem;
    height:2.6rem;
    border-radius:50%;
    font-size:1.6rem;
    line-height:1;
    cursor:pointer;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gallery-nav:hover, .gallery-nav:focus-visible{
    background:rgba(36,31,22,.8);
  }
  .gallery-prev{left:.6rem;}
  .gallery-next{right:.6rem;}
  .gallery-figure{
    margin:0;
    position:relative;
  }
  .gallery-image{
    display:block;
    width:100%;
    max-height:78vh;
    object-fit:contain;
    background:#000;
  }
  .gallery-caption{
    padding:.7rem 1rem;
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.04em;
    color:var(--ink-muted);
    text-align:center;
  }
</style>

<header class="topbar">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">← ERIC GITONGA</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span aria-current="page">DAGUERREOTYPES</span>
  </nav>
</header>

<div class="page">
  <span class="plate-no">PLATE I</span>
  <h1>Daguerreotypes</h1>
  <p class="intro">Photographs — landscapes, portraits, and documentary moments.</p>

  <section class="group" aria-labelledby="photos-label">
    <p class="group-label" id="photos-label">Photographs</p>
    <div id="gallery-root"><p class="gallery-empty">Loading albums…</p></div>
  </section>
</div>

<footer class="foot">
  <span>PLATE I · DAGUERREOTYPES</span>
  <span>ericgitonga.com/daguerreotypes</span>
</footer>

<script src="/assets/gallery.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    initGallery('daguerreotypes');
  });
</script>
