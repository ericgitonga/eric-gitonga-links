<title>Dudus — Eric Gitonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="description" content="All about Kenya's tiniest wildlife — an identification companion and a shop, both built around the same photographs.">

<style>
  :root{
    --ground:#f3efe3;
    --ground-raised:#ece4cf;
    --ink:#241f16;
    --ink-muted:#7a7160;
    --accent:#3f6b53;
    --accent-dim:#8ba38f;
    --line:#d9cfb8;
    --serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --label:'Archivo Narrow', 'Arial Narrow', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--label);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:1.3rem 1.8rem;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:.4rem;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--ground);
  }
  .breadcrumb{
    display:flex;
    align-items:baseline;
    gap:.5rem;
    font-family:var(--mono);
    font-size:.78rem;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .breadcrumb a{color:var(--ink);transition:color .15s ease;}
  .breadcrumb a:hover, .breadcrumb a:focus-visible{color:var(--accent);}
  .crumb-sep{color:var(--ink-muted); font-weight:400;}
  .breadcrumb [aria-current="page"]{color:var(--ink);}

  .page{
    max-width:680px;
    margin:0 auto;
    padding:clamp(2.5rem,6vw,4rem) clamp(1.25rem,4vw,1.5rem) 4rem;
  }

  .plate-no{
    display:block;
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.14em;
    color:var(--ink-muted);
    margin-bottom:.5rem;
  }

  h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.4rem,7vw,3.2rem);
    line-height:1.05;
    margin:0 0 .7rem;
    text-wrap:balance;
  }

  .intro{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--ink-muted);
    max-width:36em;
    margin:0;
    line-height:1.5;
  }

  section.group{margin-top:clamp(2.25rem,5vw,3rem);}
  .group-label{
    display:flex;
    align-items:baseline;
    gap:.75rem;
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 .9rem;
  }
  .group-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .entries{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.6rem;
  }
  .entry{
    border:1px solid var(--line);
    background:var(--ground-raised);
    transition:border-color .15s ease;
  }
  .entry a{
    display:block;
    padding:1rem 1.1rem;
    color:inherit;
  }
  .entry-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
  }
  .entry-name{
    font-family:var(--mono);
    font-weight:500;
    font-size:.95rem;
    color:var(--ink);
  }
  .entry-name .slash{color:var(--accent);}
  .entry-arrow{
    font-family:var(--mono);
    color:var(--ink-muted);
    transition:transform .15s ease, color .15s ease;
    flex:none;
  }
  .entry a:hover .entry-arrow, .entry a:focus-visible .entry-arrow{
    transform:translateX(3px);
    color:var(--accent);
  }
  .entry a:hover, .entry a:focus-visible{
    border-color:var(--accent);
  }
  .entry-desc{
    margin:.4rem 0 0;
    font-family:var(--serif);
    font-size:.95rem;
    color:var(--ink-muted);
    line-height:1.45;
  }

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.9rem 1.8rem;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.08em;
    color:var(--ink-muted);
  }
</style>

<header class="topbar">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">← ERIC GITONGA</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span aria-current="page">DUDUS</span>
  </nav>
</header>

<div class="page">
  <span class="plate-no">PLATE IV</span>
  <h1>Dudus</h1>
  <p class="intro">All about Kenya's tiniest wildlife — an identification companion and a shop, both built around the same photographs.</p>

  <section class="group" aria-labelledby="dudus-label">
    <p class="group-label" id="dudus-label">This ecosystem</p>
    <ul class="entries">
      <li class="entry">
        <a href="https://dudus.ericgitonga.com">
          <div class="entry-top">
            <span class="entry-name"><span class="slash">/</span>dudus-indepth</span>
            <span class="entry-arrow">↗</span>
          </div>
          <p class="entry-desc">Learn dudus.</p>
        </a>
      </li>
      <li class="entry">
        <a href="https://shop.dudus.ericgitonga.com">
          <div class="entry-top">
            <span class="entry-name"><span class="slash">/</span>dudus-merchandise</span>
            <span class="entry-arrow">↗</span>
          </div>
          <p class="entry-desc">Buy dudus merch.</p>
        </a>
      </li>
    </ul>
  </section>
</div>

<footer class="foot">
  <span>PLATE IV · DUDUS</span>
  <span>ericgitonga.com/dudus</span>
</footer>
